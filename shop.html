<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161a24">
<title>Shop | Ebadul Islam Shishir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#161a24;--pn:#1f2432;--ln:#343b4f;--tx:#eef0f6;--mu:#a3abc0;--y:#ffd23f;--m:#f72585;--g:#7ae582;--ink:#10131b;--d:'Bricolage Grotesque',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.6 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.w{max-width:1160px;margin:auto;padding:0 20px}
nav{border-bottom:1px solid var(--ln);position:sticky;top:0;background:#161a24f5;backdrop-filter:blur(8px);z-index:5}nav .w{display:flex;justify-content:space-between;align-items:center;height:60px}nav a{color:var(--mu)}nav a:hover{color:var(--y)}
.hero{position:relative;padding:56px 0 30px;text-align:center}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(55% 80% at 50% 0,rgba(255,210,63,.13),transparent);pointer-events:none}
.eyebrow{display:inline-block;background:var(--y);color:var(--ink);font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:16px}
h1,h2,h3{font-family:var(--d);line-height:1.1;letter-spacing:-.02em}h1{font-size:clamp(34px,7vw,64px)}h2{font-size:clamp(24px,4vw,34px)}.sub{color:var(--mu);max-width:560px;margin:14px auto 0}
.trust{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}.trust span{border:1px solid var(--ln);background:var(--pn);border-radius:99px;padding:6px 16px;font-size:14px;color:var(--mu)}.trust b{color:var(--g)}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:34px 0 20px}.bar input{max-width:260px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}input:focus,textarea:focus,select:focus{outline:2px solid var(--y);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:6px 16px;font:inherit;cursor:pointer}.chips .on{background:var(--y);color:var(--ink);border-color:var(--y)}
.sec{margin-top:40px}.sec h2{margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:20px}
.shc{position:relative;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--ln);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.shc:hover{transform:translateY(-6px);border-color:var(--y);box-shadow:0 18px 40px -18px rgba(255,210,63,.35)}
.shc .th{aspect-ratio:16/10;background:#242b3e center/cover}.shc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}.shc small{color:var(--mu)}
.shc h3{font-size:21px}.shc p{color:var(--mu);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}.pr{color:var(--y);font:700 20px var(--d)}.pr s{color:var(--mu);font:400 14px 'Instrument Sans';margin-left:8px}
.by{background:var(--y);color:var(--ink);border-radius:8px;padding:8px 16px;font-weight:700;font-size:14px}.bg2{position:absolute;top:12px;left:12px;background:var(--m);color:#fff;font:700 12px var(--mono);padding:4px 10px;border-radius:99px}
@media(min-width:861px){.big1{grid-column:span 2;flex-direction:row}.big1 .th{flex:1.2;aspect-ratio:auto;min-height:280px}.big1 .bd{flex:1;justify-content:center;padding:28px}.big1 h3{font-size:30px}}
@media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;border:1px solid var(--ln);background:none;color:var(--tx);font:600 16px 'Instrument Sans';cursor:pointer}.pri{background:var(--y);border-color:var(--y);color:var(--ink)}.btn:disabled{opacity:.6}
dialog{margin:auto;width:min(860px,96vw);max-height:92dvh;overflow:auto;border:1px solid var(--ln);border-radius:16px;background:var(--pn);color:var(--tx);padding:24px}dialog::backdrop{background:#000c}
.x{float:right;background:none;border:0;color:var(--mu);font:inherit;cursor:pointer}.two{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;margin-top:8px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.big{width:100%;aspect-ratio:16/10;border-radius:12px;background:#242b3e center/cover}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}.box{border:1px solid var(--ln);border-radius:10px;padding:14px;margin-top:14px;background:var(--bg)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.r2{grid-template-columns:1fr}}
.sum{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:14px 0}.sum .th2{width:72px;height:54px;border-radius:8px;background:#242b3e center/cover;flex:none}
.er{color:#ff8a8a;min-height:22px;margin-top:10px}.ok{color:var(--g)}pre{white-space:pre-wrap;font:inherit;color:var(--mu)}
footer{border-top:1px solid var(--ln);margin-top:50px;padding:26px 0;text-align:center;color:var(--mu);font-size:14px}
</style></head><body>
<nav><div class="w"><a href="index.html">&larr; Portfolio</a><b style="font-family:var(--d)">Shop</b></div></nav>
<header class="hero"><div class="w"><span class="eyebrow">Made by me</span><h1>Editing assets</h1><p class="sub">LUTs, transitions, sound packs and templates I use in my own edits.</p>
<div class="trust"><span><b>&#10003;</b> Instant delivery after payment check</span><span><b>&#10003;</b> Commercial license</span><span><b>&#10003;</b> Support on WhatsApp</span></div></div></header>
<main class="w"><div id="fs" class="sec" hidden><h2>Featured</h2><div class="grid" id="fg"></div></div>
<div class="bar"><h2 style="margin:0">All products</h2><div style="display:flex;gap:12px;flex-wrap:wrap"><input id="q" type="search" placeholder="Search..." style="max-width:220px"><div class="chips" id="cats"></div></div></div>
<div class="grid" id="grid"></div><p class="sub" id="msg"></p></main>
<footer><div class="w">&copy; Ebadul Islam Shishir &middot; <a href="index.html" style="color:var(--y)">Portfolio</a></div></footer>
<dialog id="dg"><button class="x" onclick="dg.close()">Close &#10005;</button><div id="dc"></div></dialog>
<script>
const SB='https://arqdpagnmjypthlskbps.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFycWRwYWdubWp5cHRobHNrYnBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NjExMzMsImV4cCI6MjEwNzIzNzEzM30.EbVl7soEvTMvXC1-IGB7GXdLD8yA6dPeZa_5G3A5--k',$=s=>document.querySelector(s),eh=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const api=async(p,o)=>{const r=await fetch(SB+'/rest/v1/'+p,{headers:H,...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error((j&&j.message)||t||'Error');return j};
const tk=n=>'\u09f3'+Number(n||0).toLocaleString(),yt=u=>((u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1],th=p=>p.img||(yt(p.preview)?'https://img.youtube.com/vi/'+yt(p.preview)+'/hqdefault.jpg':'');
let P=[],cat='All',S={};
async function init(){
 try{const s=await api('site?id=in.(1,2)&select=id,data');const m={};s.forEach(x=>m[x.id]=x.data||{});S=m[2]||{};const a=m[1]||{},n=Date.now(),st=a.maintStart?+new Date(a.maintStart):0,en=a.maintEnd?+new Date(a.maintEnd):0;
  if(a.maint&&n>=st&&(!en||n<en)&&location.hash!='#preview'){$('main').innerHTML='<h1 style="margin-top:40px">'+eh(a.maintTitle||'Under maintenance')+'</h1><p class="sub">'+eh(a.maintMsg||'Please check back soon.')+'</p>';return}}catch(e){}
 if(!S.on&&location.hash!='#preview'){document.querySelector('.hero').remove();$('main').innerHTML='<h1 style="margin-top:60px">Shop opening soon</h1><p class="sub">New editing assets are on the way. <a href="index.html" style="color:var(--y)">Back to portfolio</a></p>';return}
 try{P=await api('products?select=*&active=eq.true&order=pos.asc,id.asc')}catch(e){$('#msg').textContent='The shop is not ready yet. Please check back soon.';return}
 if(!P.length)$('#msg').textContent='No products yet.';draw();
 const u=new URLSearchParams(location.search),pp=P.find(x=>x.id==u.get('p'));if(pp){show(pp);if(u.get('buy')&&pp.stock!==0)buy(pp)}}
const card=(p,i,big)=>`<article class="shc${big&&!i?' big1':''}" data-i="${P.indexOf(p)}"><div class="th" style="${th(p)?`background-image:url('${eh(th(p))}')`:''}"></div>${p.badge?`<span class="bg2">${eh(p.badge)}</span>`:p.stock===0?'<span class="bg2">Sold out</span>':''}<div class="bd"><small>${eh(p.category)}</small><h3>${eh(p.name)}</h3><p>${eh(p.descr)}</p><div class="row2"><span class="pr">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</span><span class="by">${p.stock===0?'Sold out':'View and buy'}</span></div></div></article>`;
function draw(){const cs=['All',...new Set(P.map(p=>p.category).filter(Boolean))],q=$('#q').value.toLowerCase(),F=P.filter(p=>p.featured).slice(0,5);
 $('#fs').hidden=!F.length;$('#fg').innerHTML=F.map((p,i)=>card(p,i,1)).join('');
 $('#cats').innerHTML=cs.length>2?cs.map(c=>`<button class="${c==cat?'on':''}" data-c="${eh(c)}">${eh(c)}</button>`).join(''):'';
 $('#grid').innerHTML=P.filter(p=>(cat=='All'||p.category==cat)&&(p.name+' '+(p.descr||'')).toLowerCase().includes(q)).map(p=>card(p,1,0)).join('')}
$('#q').oninput=draw;$('#cats').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c;draw()}};document.addEventListener('click',e=>{const c=e.target.closest('.shc');if(c)show(P[+c.dataset.i])});
function show(p){const id=yt(p.preview),sold=p.stock===0;
 $('#dc').innerHTML=`<div class="two"><div>${id?`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`:th(p)?`<div class="big" style="background-image:url('${eh(th(p))}')"></div>`:''}</div><div><small style="color:var(--mu)">${eh(p.category)}</small><h2 style="margin:4px 0 8px">${eh(p.name)}</h2><div class="pr" style="font-size:26px">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</div><pre style="margin-top:12px">${eh(p.descr)}</pre>${sold?'<p class="er">Sold out</p>':'<div style="margin-top:18px"><button class="btn pri" id="by" style="width:100%">Buy now</button></div>'}${S.license?`<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--mu)">License and refund</summary><pre>${eh(S.license)}</pre></details>`:''}</div></div>`;
 if(!dg.open)dg.showModal();if(!sold)$('#by').onclick=()=>buy(p)}
function buy(p){const ms=[['bKash',S.bkash],['Nagad',S.nagad]].filter(x=>x[1]);let pc=0;if(!dg.open)dg.showModal();
 if(!ms.length){$('#dc').insertAdjacentHTML('beforeend','<p class="er">Payment is not set up yet. Please message me on WhatsApp.</p>');return}
 const amt=()=>Math.round(p.price*(100-pc)/100);
 $('#dc').innerHTML=`<h2 style="font-size:26px">Checkout</h2><div class="sum"><div class="th2" style="${th(p)?`background-image:url('${eh(th(p))}')`:''}"></div><div style="flex:1"><b>${eh(p.name)}</b><br><span class="pr" id="tt">${tk(amt())}</span></div></div>
 <form id="of" style="display:block"><div class="r2"><div><label>Your name *</label><input id="on" required></div><div><label>Phone *</label><input id="op" type="tel" required></div></div><label>Email (optional)</label><input id="oe" type="email"><div class="r2"><div><label>Coupon code</label><input id="oc"></div><div><label>&nbsp;</label><button type="button" class="btn" id="ca" style="width:100%">Apply</button></div></div><p class="ok" id="cm"></p>
 <label>Pay with</label><select id="om">${ms.map(m=>`<option>${m[0]}</option>`).join('')}</select><div class="box" id="pi"></div><label>Transaction ID (TrxID) *</label><input id="ot" required><p class="er" id="oer"></p><button class="btn pri" id="os" type="submit" style="width:100%">Place order</button></form>`;
 const info=()=>{const m=$('#om').value,n=m=='bKash'?S.bkash:S.nagad;$('#tt').textContent=tk(amt());$('#pi').innerHTML=`Send Money <b>${tk(amt())}</b> to <b>${m} ${eh(n)}</b>, then paste the TrxID below.${S.note?`<br><span style="color:var(--mu)">${eh(S.note)}</span>`:''}`};info();$('#om').onchange=info;
 $('#ca').onclick=async()=>{try{pc=await api('rpc/check_coupon',{method:'POST',body:JSON.stringify({c:$('#oc').value})})||0}catch(e){pc=0}$('#cm').textContent=pc?pc+'% discount applied.':'Invalid coupon.';info()};
 $('#of').onsubmit=async e=>{e.preventDefault();const b=$('#os');b.disabled=true;b.textContent='Sending...';$('#oer').textContent='';
  try{const r=await api('rpc/place_order',{method:'POST',body:JSON.stringify({p_pid:p.id,p_name:$('#on').value,p_phone:$('#op').value,p_email:$('#oe').value,p_method:$('#om').value,p_trx:$('#ot').value,p_coupon:$('#oc').value})});
   const wa=String(S.wa||'8801887373866').replace(/\D/g,''),t=`Hi, I placed order ${r.code} for ${r.name} (${tk(r.amount)}). TrxID: ${$('#ot').value}`;
   $('#dc').innerHTML=`<h2 style="font-size:28px">Order received &#10003;</h2><p style="margin-top:10px">Order number: <b style="color:var(--y)">${eh(r.code)}</b><br>Amount: <b>${tk(r.amount)}</b></p><p style="color:var(--mu);margin:12px 0">I will check your payment and send the download link soon. Message me to speed it up.</p><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(t)}">Send on WhatsApp</a>`}
  catch(x){$('#oer').textContent=x.message;b.disabled=false;b.textContent='Place order'}}}
init();
</script></body></html>
