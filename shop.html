<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161a24">
<title>Shop | Ebadul Islam Shishir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161a24;--pn:#1f2432;--ln:#343b4f;--tx:#eef0f6;--mu:#a3abc0;--y:#ffd23f;--m:#f72585;--g:#7ae582;--ink:#10131b;--d:'Bricolage Grotesque',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.6 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.w{max-width:1120px;margin:auto;padding:0 20px}
nav{border-bottom:1px solid var(--ln);position:sticky;top:0;background:#161a24f5;z-index:5}nav .w{display:flex;justify-content:space-between;align-items:center;height:60px}nav a{color:var(--mu)}nav a:hover{color:var(--y)}
h1,h2,h3{font-family:var(--d);line-height:1.1;letter-spacing:-.02em}h1{font-size:clamp(32px,6vw,56px);margin:44px 0 10px}.sub{color:var(--mu)}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:26px 0}.bar input{max-width:260px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}.chips .on{background:var(--y);color:var(--ink);border-color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:26px 20px;padding-bottom:70px}
.card{cursor:pointer}.th{aspect-ratio:4/3;border-radius:10px;background:#242b3e center/cover;position:relative;border:1px solid var(--ln);transition:transform .25s}.card:hover .th{transform:translateY(-4px)}
.tag{position:absolute;top:10px;left:10px;background:var(--m);color:#fff;font:600 12px 'Instrument Sans';padding:3px 10px;border-radius:99px}
.card small{color:var(--mu);display:block;margin-top:10px}.card h3{font-size:20px;margin:2px 0}.pr{font-weight:600;color:var(--y)}.pr s{color:var(--mu);font-weight:400;margin-left:8px}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;border:1px solid var(--ln);background:none;color:var(--tx);font:600 16px 'Instrument Sans';cursor:pointer}.pri{background:var(--y);border-color:var(--y);color:var(--ink)}.btn:disabled{opacity:.6}
dialog{margin:auto;width:min(720px,96vw);max-height:92dvh;overflow:auto;border:1px solid var(--ln);border-radius:14px;background:var(--pn);color:var(--tx);padding:22px}dialog::backdrop{background:#000c}
.x{float:right;background:none;border:0;color:var(--mu);font:inherit;cursor:pointer}
.big{width:100%;aspect-ratio:16/9;border-radius:10px;background:#242b3e center/cover;margin:10px 0 14px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}.box{border:1px solid var(--ln);border-radius:10px;padding:14px;margin-top:14px;background:var(--bg)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.r2{grid-template-columns:1fr}}
.er{color:#ff8a8a;min-height:22px;margin-top:10px}.ok{color:var(--g)}pre{white-space:pre-wrap;font:inherit;color:var(--mu)}
</style></head><body>
<nav><div class="w"><a href="index.html">&larr; Portfolio</a><b style="font-family:var(--d)">Shop</b></div></nav>
<main class="w"><h1>Editing assets</h1><p class="sub">LUTs, transitions, sound packs and templates made by me.</p>
<div class="bar"><input id="q" type="search" placeholder="Search..."><div class="chips" id="cats"></div></div>
<div class="grid" id="grid"></div><p class="sub" id="msg"></p></main>
<dialog id="dg"><button class="x" onclick="dg.close()">Close &#10005;</button><div id="dc"></div></dialog>
<script>
const SB='https://arqdpagnmjypthlskbps.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFycWRwYWdubWp5cHRobHNrYnBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NjExMzMsImV4cCI6MjEwNzIzNzEzM30.EbVl7soEvTMvXC1-IGB7GXdLD8yA6dPeZa_5G3A5--k',$=s=>document.querySelector(s),eh=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const api=async(p,o)=>{const r=await fetch(SB+'/rest/v1/'+p,{headers:H,...o}),t=await r.text();let j;try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error((j&&j.message)||t||'Error');return j};
const tk=n=>'\u09f3'+Number(n||0).toLocaleString(),yt=u=>((u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];
let P=[],cat='All',S={};
async function init(){
 try{const s=await api('site?id=in.(1,2)&select=id,data');const m={};s.forEach(x=>m[x.id]=x.data||{});S=m[2]||{};const a=m[1]||{},n=Date.now(),st=a.maintStart?+new Date(a.maintStart):0,en=a.maintEnd?+new Date(a.maintEnd):0;
  if(a.maint&&n>=st&&(!en||n<en)&&location.hash!='#preview'){$('main').innerHTML='<h1>'+eh(a.maintTitle||'Under maintenance')+'</h1><p class="sub">'+eh(a.maintMsg||'Please check back soon.')+'</p>';return}}catch(e){}
 if(!S.on&&location.hash!='#preview'){$('main').innerHTML='<h1>Shop opening soon</h1><p class="sub">New editing assets are on the way. <a href="index.html" style="color:var(--y)">Back to portfolio</a></p>';return}
 try{P=await api('products?select=*&active=eq.true&order=pos.asc,id.asc')}catch(e){$('#msg').textContent='The shop is not ready yet. Please check back soon.';return}
 if(!P.length)$('#msg').textContent='No products yet.';draw();const pid=new URLSearchParams(location.search).get('p'),pp=P.find(x=>x.id==pid);if(pp)show(pp)}
function draw(){const cs=['All',...new Set(P.map(p=>p.category).filter(Boolean))],q=$('#q').value.toLowerCase();
 $('#cats').innerHTML=cs.length>2?cs.map(c=>`<button class="${c==cat?'on':''}" data-c="${eh(c)}">${eh(c)}</button>`).join(''):'';
 $('#grid').innerHTML=P.map((p,i)=>({p,i})).filter(({p})=>(cat=='All'||p.category==cat)&&(p.name+' '+(p.descr||'')).toLowerCase().includes(q)).map(({p,i})=>`<article class="card" data-i="${i}"><div class="th" style="${p.img?`background-image:url('${eh(p.img)}')`:''}">${p.stock===0?'<span class="tag">Sold out</span>':''}</div><small>${eh(p.category)}</small><h3>${eh(p.name)}</h3><div class="pr">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</div></article>`).join('')}
$('#q').oninput=draw;$('#cats').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c;draw()}};$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)show(P[+c.dataset.i])};
function show(p){const id=yt(p.preview),sold=p.stock===0;
 $('#dc').innerHTML=`<h2 style="font-size:28px">${eh(p.name)}</h2><div class="pr" style="font-size:20px;margin-top:6px">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</div>${id?`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`:p.img?`<div class="big" style="background-image:url('${eh(p.img)}')"></div>`:''}<pre style="margin-top:8px">${eh(p.descr)}</pre>${S.license?`<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--mu)">License and refund</summary><pre>${eh(S.license)}</pre></details>`:''}${sold?'<p class="er">Sold out</p>':'<div class="bt" style="margin-top:16px"><button class="btn pri" id="by">Buy now</button></div>'}`;
 if(!dg.open)dg.showModal();if(!sold)$('#by').onclick=()=>buy(p)}
function buy(p){const ms=[['bKash',S.bkash],['Nagad',S.nagad]].filter(x=>x[1]);let pc=0;
 if(!ms.length){$('#dc').insertAdjacentHTML('beforeend','<p class="er">Payment is not set up yet. Please message me on WhatsApp.</p>');return}
 const amt=()=>Math.round(p.price*(100-pc)/100);
 $('#dc').innerHTML=`<h2 style="font-size:24px">Buy: ${eh(p.name)}</h2><form id="of" style="display:block"><div class="r2"><div><label>Your name *</label><input id="on" required></div><div><label>Phone *</label><input id="op" type="tel" required></div></div><label>Email (optional)</label><input id="oe" type="email"><div class="r2"><div><label>Coupon code</label><input id="oc"></div><div><label>&nbsp;</label><button type="button" class="btn" id="ca" style="width:100%">Apply</button></div></div><p class="ok" id="cm"></p>
 <label>Pay with</label><select id="om">${ms.map(m=>`<option>${m[0]}</option>`).join('')}</select>
 <div class="box" id="pi"></div><label>Transaction ID (TrxID) *</label><input id="ot" required><p class="er" id="oer"></p><button class="btn pri" id="os" type="submit">Place order</button></form>`;
 const info=()=>{const m=$('#om').value,n=m=='bKash'?S.bkash:S.nagad;$('#pi').innerHTML=`Send Money <b>${tk(amt())}</b> to <b>${m} ${eh(n)}</b>, then paste the TrxID below.${S.note?`<br><span class="sub">${eh(S.note)}</span>`:''}`};info();$('#om').onchange=info;
 $('#ca').onclick=async()=>{try{pc=await api('rpc/check_coupon',{method:'POST',body:JSON.stringify({c:$('#oc').value})})||0}catch(e){pc=0}$('#cm').textContent=pc?pc+'% discount applied.':'Invalid coupon.';info()};
 $('#of').onsubmit=async e=>{e.preventDefault();const b=$('#os');b.disabled=true;b.textContent='Sending...';$('#oer').textContent='';
  try{const r=await api('rpc/place_order',{method:'POST',body:JSON.stringify({p_pid:p.id,p_name:$('#on').value,p_phone:$('#op').value,p_email:$('#oe').value,p_method:$('#om').value,p_trx:$('#ot').value,p_coupon:$('#oc').value})});
   const wa=String(S.wa||'8801887373866').replace(/\D/g,''),t=`Hi, I placed order ${r.code} for ${r.name} (${tk(r.amount)}). TrxID: ${$('#ot').value}`;
   $('#dc').innerHTML=`<h2 style="font-size:26px">Order received</h2><p style="margin-top:10px">Order number: <b style="color:var(--y)">${eh(r.code)}</b><br>Amount: <b>${tk(r.amount)}</b></p><p class="sub" style="margin:12px 0">I will check your payment and send the download link soon. Message me to speed it up.</p><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(t)}">Send on WhatsApp</a>`}
  catch(x){$('#oer').textContent=x.message;b.disabled=false;b.textContent='Place order'}}}
init();
</script></body></html>
