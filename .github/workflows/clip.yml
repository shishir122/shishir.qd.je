name: clip
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      url:
        required: true
      items:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -U "yt-dlp[default]"
      - name: Download, cut and store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_URL: ${{ inputs.url }}
          ITEMS: ${{ inputs.items }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, urllib.request, glob, datetime
          SB = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_SERVICE_KEY"]
          JOB = os.environ["JOB_ID"]
          URL = os.environ["VIDEO_URL"]
          ITEMS = json.loads(os.environ["ITEMS"])

          def call(method, path, body=None, ctype="application/json", extra=None):
              h = {"apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": ctype}
              if extra:
                  h.update(extra)
              if body is not None and not isinstance(body, (bytes, bytearray)):
                  body = json.dumps(body).encode()
              r = urllib.request.Request(SB + path, data=body, method=method, headers=h)
              with urllib.request.urlopen(r, timeout=300) as x:
                  return x.read()

          def setjob(**f):
              try:
                  call("PATCH", "/rest/v1/clip_jobs?id=eq." + JOB, f)
              except Exception as e:
                  print("setjob error", e)

          def sh(cmd):
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.returncode:
                  raise RuntimeError((p.stderr or p.stdout)[-700:])

          # old clips are deleted after 3 days to save space
          try:
              lst = json.loads(call("POST", "/storage/v1/object/list/clips", {"prefix": "", "limit": 500, "offset": 0}))
              limit = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=3)
              old = [o["name"] for o in lst if o.get("created_at") and
                     datetime.datetime.fromisoformat(o["created_at"].replace("Z", "+00:00")) < limit]
              if old:
                  call("DELETE", "/storage/v1/object/clips", {"prefixes": old})
          except Exception as e:
              print("cleanup skipped", e)

          cookies = os.environ.get("YT_COOKIES", "").strip()
          if cookies:
              open("cookies.txt", "w").write(cookies)
          files = []
          try:
              for i, it in enumerate(ITEMS):
                  setjob(status="running", message="ক্লিপ %d/%d নামানো হচ্ছে" % (i + 1, len(ITEMS)))
                  s, e = float(it["start"]), float(it["end"])
                  cmd = ["yt-dlp", "-f", "bv*[height<=1080]+ba/b[height<=1080]/b",
                         "--download-sections", "*%.2f-%.2f" % (s, e), "--force-keyframes-at-cuts",
                         "--merge-output-format", "mp4", "--no-playlist", "-o", "raw%d.%%(ext)s" % i]
                  if cookies:
                      cmd += ["--cookies", "cookies.txt"]
                  sh(cmd + [URL])
                  raw = glob.glob("raw%d.*" % i)[0]
                  out = "out%d.mp4" % i
                  for rate in ("4M", "2.5M", "1.5M"):
                      sh(["ffmpeg", "-y", "-i", raw, "-vf", "scale=-2:'min(1080,ih)'", "-c:v", "libx264",
                          "-preset", "veryfast", "-crf", "24", "-maxrate", rate, "-bufsize", "8M",
                          "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart", out])
                      if os.path.getsize(out) < 49000000:
                          break
                  name = "%s_%d.mp4" % (JOB, i)
                  call("POST", "/storage/v1/object/clips/" + name, open(out, "rb").read(), "video/mp4", {"x-upsert": "true"})
                  files.append({"i": i, "url": SB + "/storage/v1/object/public/clips/" + name})
              setjob(status="done", message="সব ক্লিপ নেমেছে", files=files)
          except Exception as ex:
              t = str(ex)
              if "Sign in to confirm" in t or "not a bot" in t.lower():
                  t = "YouTube এই সার্ভারকে ব্লক করেছে (bot check)। GitHub সিক্রেটে YT_COOKIES যোগ করুন। " + t[-200:]
              setjob(status="failed", message=t[-500:])
              raise
          PY
